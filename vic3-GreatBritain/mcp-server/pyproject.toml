[project]
name = "vic3-greatbritain-mcp-server"
version = "0.1.0"
description = "vic3-GreatBritain 局的 MCP server：把 mod 写进 error.log 的年度记录暴露成读工具"
requires-python = ">=3.10"
dependencies = ["mcp>=2"]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: 端到端演示测试，直接调游戏接入模块的函数看效果，需要游戏在跑，默认不跑；跑法 uv run pytest -m e2e -s"]
addopts = ["-m", "not e2e"]
