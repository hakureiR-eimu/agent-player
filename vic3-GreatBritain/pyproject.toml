[project]
name = "harness"
version = "0.1.0"
description = "维多利亚3大不列颠 agent 玩家的 harness（文档见 docs/prd/harness.md）"
requires-python = ">=3.11"
dependencies = [
    "claude-agent-sdk>=0.2.187",
    "discord-py>=2.4",
]

[dependency-groups]
dev = ["pytest>=8", "mypy>=1.14"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# 包源走清华镜像：本机直连 pypi 拉不动大 wheel（claude-agent-sdk 带 CLI 二进制上百 MB）
[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.setuptools]
py-modules = ["main", "config", "events", "dispatcher"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["integration: 子模块集成测试，直接打系统外的东西（真游戏、真 Discord、真 SDK 会话），前提不满足时失败并报错，默认不跑"]
addopts = ["-m", "not integration"]

[tool.mypy]
python_version = "3.11"
files = ["src", "test"]
# 平级导入的三个根：src（主体与三大模块）、test（conftest）、test/game（sample）；
# explicit_package_bases＝模块名按这些根算（全库无 __init__.py 的命名空间包，与运行时 sys.path 一致）
mypy_path = ["src", "test", "test/game"]
explicit_package_bases = true
