[project]
name = "harness"
version = "0.1.0"
description = "维多利亚3大不列颠 agent 玩家的 harness（文档见 docs/prd/harness.md）"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["agent", "game", "game.impl", "im"]
py-modules = ["main", "config", "events", "dispatcher"]

[tool.pytest.ini_options]
testpaths = ["test"]
markers = ["e2e: game 模块端到端测试，直接对真实游戏验证，需要游戏在跑，默认不跑；跑法 uv run pytest -m e2e -s"]
addopts = ["-m", "not e2e"]
