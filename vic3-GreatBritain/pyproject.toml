[project]
name = "harness"
version = "0.1.0"
description = "vic3 agent 的身体：一个 Python 进程装四块——主体＋游戏接入、agent、IM 接入（文档见 docs/prd/harness.md）"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["agent", "game", "im"]
py-modules = ["main", "config", "events", "dispatcher"]

[tool.pytest.ini_options]
testpaths = ["test"]
