[project]
name = "harness"
version = "0.1.0"
description = "维多利亚3大不列颠 agent 玩家的 harness（文档见 docs/prd/harness.md）"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["agent", "game", "im"]
py-modules = ["main", "config", "events", "dispatcher"]

[tool.pytest.ini_options]
testpaths = ["test"]
