<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>游戏 agent 控制台</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <h1>游戏 agent 控制台</h1>
        <p class="subtitle">1836 年的列强棋局，在这一屏开局</p>
      </div>
      <span id="modeBadge" class="badge ok">飞书模式</span>
    </header>
    <p id="configHint" class="config-hint"></p>

    <!-- 有存档：继续游戏 -->
    <section id="resumeCard" class="card hidden">
      <h2>有一局存着</h2>
      <p id="resumeMeta" class="hint"></p>
      <div class="actions">
        <button id="resumeBtn" class="primary">继续这局</button>
      </div>
    </section>

    <!-- 建局 -->
    <section id="setup" class="card hidden">
      <h2>开一局</h2>
      <label class="row">
        <span class="field-label">局名</span>
        <input id="gameName" placeholder="比如：1444 拜占庭的崛起" maxlength="30" style="flex:1" />
      </label>
      <p class="hint">局名一身三用：游戏名目、局文件夹名、公屏大群群名。飞书应用（DM 和各国）多局复用，建一次管所有局；每局的 agent 状态各归各的局文件夹，局与局不串。</p>
      <fieldset>
        <legend>拉起哪些国家</legend>
        <div id="countries" class="countries"></div>
      </fieldset>
      <div class="actions">
        <button id="createBtn" class="primary">创建这局</button>
        <span id="setupError" class="error"></span>
      </div>
    </section>

    <!-- 局进行中 -->
    <section id="game" class="hidden">
      <div class="game-grid">
        <section class="card">
          <h2 id="gameTitle"></h2>
          <p id="gameMeta" class="hint"></p>
          <h3>公屏大群</h3>
          <p id="mainGroup"></p>
          <div class="row">
            <input id="humanIds" placeholder="真人玩家的 open_id 或 user_id，逗号分隔" style="flex:1" />
            <button id="addHumanBtn">拉真人进群</button>
          </div>
          <p class="hint">真人都由 DM 拉进群（DM 当群主）。open_id 在飞书开发者后台的 API 调试台能查到。</p>
          <h3>agent</h3>
          <table id="agentTable">
            <thead><tr><th>国家</th><th>状态</th><th>排队</th><th>轮数</th><th>会话</th><th>备注</th></tr></thead>
            <tbody></tbody>
          </table>
          <h3>群</h3>
          <ul id="groupList"></ul>
          <div class="actions">
            <button id="saveBtn">保存并退出</button>
            <button id="stopBtn" class="danger">结束游戏</button>
          </div>
        </section>

        <section class="card">
          <h2>聊天</h2>
          <div id="chat" class="chat"></div>
          <p id="chatHint" class="hint">真话去飞书群里说，这里只看不说。</p>
        </section>
      </div>
    </section>

    <section class="card">
      <h2>运行日志</h2>
      <div id="logs" class="logs"></div>
    </section>
  </div>

  <script src="/app.js"></script>
</body>
</html>
